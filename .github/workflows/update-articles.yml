name: Update DevOps articles

on:
  schedule:
    - cron: '30 5 * * *' # Daily at 11:00 IST
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_articles.py'
      - '.github/workflows/update-articles.yml'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch public RSS feeds
        run: python scripts/fetch_articles.py
      - name: Commit updated article feed
        run: |
          if git diff --quiet -- articles.json; then
            echo 'No article changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles.json
          git commit -m "chore: refresh DevOps articles feed"
          git push
